name: rustix-auto-alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [rustix]

concurrency:
  group: rustix-auto
  cancel-in-progress: false

jobs:
  rustix-alive:
    if: github.event_name != 'repository_dispatch' || contains(github.event.client_payload.status, 'Down')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl gnupg
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启用 WARP 网络（换干净 IP 过防护）
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 运行保活脚本
        env:
          ACCOUNTS: ${{ secrets.RUSTIX_ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "=== WARP 连通性检查 ==="
          curl -s --max-time 8 https://api.ip.sb/geoip || echo "WARP 不可用"
          echo ""
          echo "使用 WARP 系统隧道直连（无显式代理）"
          python main.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: |
            run.log
            debug_*.png
          retention-days: 7
